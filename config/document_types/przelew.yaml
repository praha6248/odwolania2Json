name: przelew
label: Potwierdzenie przelewu
description: Bank transfer confirmation for the KIO entry fee or the stamp duty on a power of attorney.

classify:
  head_chars: 600
  head_keywords:
    potwierdzenie wykonania przelewu: 6
    potwierdzenie realizacji: 5
    polecenie przelewu: 5
    potwierdzenie przelewu: 5
    potwierdzenie transakcji: 4
    przelew krajowy: 4
    przelew z rachunku: 4
    przelew elixir: 4
    szczegóły transakcji: 3
    szczegóły zlecenia: 3
    przelew: 2
    bank: 2
  keywords:
    rachunek odbiorcy: 2
    rachunek zleceniodawcy: 2
    rachunek kontrahenta: 2
    z rachunku: 2
    na rachunek: 2
    kwota operacji: 2
    kwota przelewu: 2
    data operacji: 2
    data wykonania: 2
    tytuł przelewu: 2
    tytułem: 2
    numer referencyjny: 1
    zrealizowano: 1
  filename_hints:
    przelew: 4
    potwierdzenie: 2
  require:
    - name: numer rachunku
      scope: all
      any: ['(?:PL)?\s?\d{2}(?:\s?\d{4}){6}']
  negative:
    '^\s*Sygn\.?\s*akt': 30
    '^\s*(?:WYROK|POSTANOWIENIE|UCHWAŁA|ZARZĄDZENIE)\s*$': 30
    'Krajowa\s+Izba\s+Odwoławcza\s*[-–]?\s*w\s+składzie': 30
    '^\s*Przewodnicząc\w*\s*:': 20
    '^\s*Protokolant\w*\s*:': 20
    '^\s*(?:orzeka|postanawia)\s*:': 20
    '^\s*ODPOWIEDŹ\s+NA\s+ODWOŁANIE': 40
    '^\s*PRZYSTĄPIENIE\b': 40

fields:
  data_operacji:
    description: Data wykonania operacji (ISO YYYY-MM-DD).
    normalize: [date_iso]
    extract:
      - type: label
        labels: ["Data operacji", "Data transakcji", "Data wykonania", "Data realizacji", "Data księgowania", "Data zlecenia", "Data"]
        value: '\d[\d./\-]+\d|\d{1,2} \w+ \d{4}'
      - type: regex
        pattern: 'Z[li]econa\s+data\s+wykonania\s*\n\s*\S+\s+(\d{1,2}[./\- ]\d{1,2}[./\- ]\d{4})'
      - type: regex
        pattern: '^\s*(\d{4}-\d{2}-\d{2})\s+Z\s+rachunku'
      - type: regex
        pattern: 'w dniu\s+(\d[\d./\-]+\d|\d{1,2} \w+ \d{4})'
      - type: regex
        pattern: '(?:zrealizowan\w+|wykonan\w+)\s+(\d[\d./\-]+\d|\d{1,2} \w+ \d{4})'
      - type: label
        labels: ["Data wydruku", "Data wystawienia", "Data wystawena"]
        value: '\d[\d./\-]+\d|\d{1,2} \d{1,2} \d{4}'

  kwota:
    description: Kwota przelewu jako liczba (np. 7500.0).
    normalize: [amount]
    extract:
      - type: label
        labels: ["Kwota operacji", "Kwota przelewu", "Kwota transakcji", "Kwota", "Awota", "Wartość"]
        value: '[-−–]?[ \t]*(?:PLN|EUR)?[ \t]?\d[\d \u00a0.,]*\d(?=[ \t]*(?:PLN|zł|EUR|\(|$))|\d+'
      - type: regex
        pattern: 'Przelew\s+z\s+rachunku\s+[-−–]?[ \t]*(\d[\d \u00a0.,]*\d)[ \t]*(?:PLN|zł)'
      - type: regex
        pattern: 'w kwocie\s+([\d][\d \.,]*\d)'

  z_rachunku:
    description: Numer rachunku nadawcy, 26 cyfr bez spacji, z prefiksem PL tylko gdy widnieje w dokumencie.
    normalize: [account]
    extract:
      - type: label
        labels: ["Rachunek zleceniodawcy", "Rachunek obciążany", "Rachunek nadawcy", "Rachunek płatnika", "Z rachunku", "Numer rachunku nadawcy", "Rachunek obciążony"]
        value: '(?:PL)?\s?\d{2}(?:\s?\d{4}){6}'
      - type: regex
        pattern: 'z rachunku(?: nr)?\s*((?:PL)?\s?\d{2}(?:\s?\d{4}){6})'
      - type: regex
        pattern: '(?<!\d)((?:PL\s*)?\d{2}(?: ?\d{4}){6})(?!\d)'
        occurrence: 0

  na_rachunek:
    description: Numer rachunku odbiorcy, 26 cyfr bez spacji, z prefiksem PL tylko gdy widnieje w dokumencie.
    normalize: [account]
    extract:
      - type: label
        labels: ["Rachunek odbiorcy", "Rachunek uznawany", "Rachunek beneficjenta", "Na rachunek", "Rachunek uznany", "Numer rachunku odbiorcy"]
        value: '(?:PL)?\s?\d{2}(?:\s?\d{4}){6}'
      - type: regex
        pattern: 'na rachunek(?: nr)?\s*((?:PL)?\s?\d{2}(?:\s?\d{4}){6})'
      - type: regex
        pattern: '(?<!\d)((?:PL\s*)?\d{2}(?: ?\d{4}){6})(?!\d)'
        occurrence: 1

  numer_transakcji:
    optional: true
    description: Numer referencyjny / identyfikator operacji, jeśli występuje.
    normalize: [strip]
    extract:
      - type: label
        labels: ["Numer referencyjny operacji", "Numer referencyjny transakcji", "Numer referencyjny", "Nr ref\\.", "Identyfikator operacji", "Identyfikator transakcji", "Numer transakcji", "Nr transakcji", "ID transakcji", "Referencje"]
        value: '[A-Z]{2,}[A-Z0-9/\-]*\d[A-Z0-9/\-]*|\d{5,}'
        ignore_case: false
      - type: regex
        pattern: '(?:Status\s+Numer\s+(?:Wykonany|Zrealizowany)|Numer)\s+(\d{5,})\s+transakcji'
      - type: regex
        pattern: '\b(CEN\d{10,})\b'
        ignore_case: false

  tytul:
    description: Pełny tytuł przelewu.
    normalize: [strip_quotes, strip]
    extract:
      - type: label
        labels: ["Tytuł przelewu", "Tytułem", "Tytuł", "Szczegóły płatności", "Szczegóły piatnosct", "Opis"]
        until: '\n(?:Numer|Nr |Status|Identyfikator|Typ |Kanał|Opłata|Data|Kwota|Awota|Rachunek|Waluta|Tryb|ZREALIZOWANO|Potwierdzenie|Z poważaniem|Dokument|Signature|Credo Bank|Bank |W razie|Referencje|Wartość|NR REF|STATUS|TRYB|WALUTA|GODZ)|”\.?|"\.'
        max_chars: 300

  platnik:
    optional: true
    description: Nazwa zleceniodawcy przelewu (pole pomocnicze, poza JSON).
    normalize: [strip]
    extract:
      - type: label
        labels: ["Nazwa zleceniodawcy", "Zleceniodawca", "Płatnik", "Nadawca", "Dane nadawcy"]
        value: '[^\n,]+'
      - type: regex
        pattern: 'prowadzonego\s+dla\s+([^,\n]+)'

  numer_postepowania:
    optional: true
    description: Numer postępowania z tytułu przelewu (pole pomocnicze, poza JSON).
    extract:
      - type: regex
        pattern: '(?:w\s+przetargu|postępowani\w*\s+nr|nr\s+postępowania)\s*:?\s*([A-Za-z0-9][A-Za-z0-9./\-_]*[A-Za-z0-9])'

case:
  party: platnik
  reference: numer_postepowania

template:
  przelew_bankowy:
    data_operacji: $data_operacji
    kwota: $kwota
    na_rachunek: $na_rachunek
    numer_transakcji: $numer_transakcji
    tytul: $tytul
    z_rachunku: $z_rachunku

llm:
  fields: [data_operacji, kwota, na_rachunek, z_rachunku, numer_transakcji, tytul]
