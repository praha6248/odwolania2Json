# Public documents used by tools/real_world_test.py to test the application on real-world input.
# The PDFs themselves are never committed (personal data, third-party copyright); they are downloaded to data_real/.
#
# expect: the document type the application should recognise (odwolanie, pelnomocnictwo, przelew) or "none"
#         for look-alike documents that must get an empty JSON.
# values: hand-checked values of the output JSON, keyed by path (e.g. Odwolujacy[0].nazwa). Only values that were
#         verified by reading the PDF are listed; a value of null means the document really does not contain it.
#         Text longer than 30 characters is compared with the UZP rule (similarity >= 0.8). Values that carry a
#         person's name are stored as sha256:<first 16 hex digits of the SHA-256 of the exact UTF-8 value>.

kio_sample: {start: 6000, end: 36000, count: 30}   # evenly spaced KIO rulings (look-alike negatives)

documents:
